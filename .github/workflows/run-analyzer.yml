name: Run Ghost Machine Analyzer

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run analyzer
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ghost_machine_analyzer_cloud.py

      - name: Commit updated signal
        run: |
          git config user.name "ghost-machine-bot"
          git config user.email "actions@github.com"
          git add last_signal.json
          git diff --quiet --cached || git commit -m "Update signal $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
